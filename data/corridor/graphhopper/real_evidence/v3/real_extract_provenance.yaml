# corridor_edge_mapping.json were generated by Python's json.dump() in text
# mode on Windows, which writes CRLF line endings. Git normalizes CRLF->LF
# when these files are added/checked out under this repo's autocrlf
# behaviour, so the byte-for-byte hash of the file "as most recently
# written to disk" can differ from the hash of "the file as git stores and
# checks it out". To make this checksum robust across platforms/checkouts
# (the same fix already applied to fixture_graph.v1.sha256 in section 5),
# the hashes below are computed over LF-normalized bytes
