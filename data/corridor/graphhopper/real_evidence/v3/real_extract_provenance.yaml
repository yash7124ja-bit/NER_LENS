#
# TIMESTAMP METHODOLOGY (unchanged from v2, reused here): all authoritative
# timestamps below are captured independently, immediately before/after each
# network or container operation, by this session's own shell clock
# (`date -u`). No HTTP response header (Date/Last-Modified/Age) is treated
# as an authoritative timestamp anywhere in this document.
#
# WHAT CHANGED FROM v2 (see v2_superseded/SUPERSEDED.md for full detail):
#   1. rigid_truck.json: hgv==DELIVERY / hgv==DESTINATION / road_access==
#      PRIVATE are now hard-excluded (multiply_by "0"), not a 0.1x penalty.
#   2. rigid_truck.json (and, as a consistency extension, light_goods.json
#      and emergency.json): max_weight_except no longer bypasses an active
#      max_weight restriction below the profile's own limit; no
#      authorization-backed applicability input exists in M0 to justify
#      that bypass.
#   3. The NH-27 hypothesis is now queried three ways per profile, not one:
#      (a) nh27_control_direct -- the original unconstrained two-point query,
#          RELABELLED as a control, never as NH-27 continuity evidence;
#      (b) nh27_via_bands -- one threaded query through all six audited band
#          waypoints (band_1..band_6 endpoint coordinates from
#          fixture_graph.v1.json / route-manifest.yaml), the actual
#          "NH-27 candidate" run;
#      (c) six independent nh27_leg{1..6}_bandN_<profile> two-point queries,
#          one per audited band, giving a direct per-band road-ref mapping
#          instead of an inference from a single multi-point response.
#      NH-6 is queried exactly as in v1/v2 (Shillong/Jowai waypoint-biased),
#      unchanged method.

