real_findings:
  all_27_queries_returned_http_200: true
  hgv_tag_coverage: "missing (unset) along the entire returned path, every profile, every route/leg queried"
  max_height_max_weight_tag_coverage: "unset (None) along the entire returned path, every profile, every route/leg queried"
  road_access_coverage: "uniformly 'yes' along every returned path in this run; no PRIVATE/DELIVERY/DESTINATION-tagged way was encountered on any of the 27 queried paths in this extract"
  rigid_truck_fix_changed_feasibility_here: false   # see vehicle_profiles.safety_effect_of_the_fix_on_this_dataset above
  warnings_or_errors: "none; all 27 queries returned HTTP 200 with no 'hints'-reported routing errors (only visited_nodes performance stats)"
  band5_path_divergence: "light_goods takes a materially different (shorter) physical path than rigid_truck/emergency on band_5_maibang_harangajao_balachera_hill, with no access/hgv/height/weight difference explaining it -- a distance_influence routing-preference effect, not a legality exclusion. See corridor_edge_mapping.json divergence_findings."
  road_name_evidence_nh27_control: "Dominated by NH6 (~66-68% of distance) with NH27 only ~2.1% of distance; NH37 and SH38/SH-023 also present. This is honest evidence that the unconstrained shortest path is NOT the NH-27 corridor."
  road_name_evidence_nh27_via_bands: "NH27 rises to 45.4% (light_goods) / 60.6% (rigid_truck, emergency) of distance -- the largest single ref, but the route is a real mix with SH37, Nc-M-1 (a numbered corridor/link road ref, not further identified in this OSM extract), NH137G, CA-M-001, NH715A, SH3, NH29, NH329, and unnamed local roads. No fabricated smoothing to '100% NH27' was applied."
  road_name_evidence_nh6: "Unchanged from v2: literal 'NH6' street_name appears in all three profile queries for this route; single-segment evidence, not full continuity."
  osm_way_ids: "NOT obtainable via GraphHopper's public /route or /info API in this version; GraphHopper's path_details expose street_name/street_ref (OSM tags) and internal edge/node IDs meaningful only inside its own graph, not OSM way IDs. This audit does not fabricate way IDs; where the task asked for them 'where obtainable', they were not obtainable through this API surface, and that limitation is stated here rather than worked around."

honest_limitations:
  - "Corridor identity for the NH-27 hypothesis is now supported by three layers of evidence (control, via-bands threaded query, six independent per-band legs) instead of one, but it remains real-road-network evidence, not a claim that the audited corridor is a single continuously-named NH27 way. See real_findings.road_name_evidence_nh27_via_bands."
  - "route_nh6_alternative is explicitly waypoint-biased through Shillong and Jowai; GraphHopper does not have a 'follow this named highway' query mode. Unchanged from v1/v2."
  - "turn restrictions were not extracted from the real graph; GraphHopper's /route path-details API does not expose turn-cost/turn-restriction tables. This remains synthetic-fixture-only evidence (see docs/decisions/route-audit.md section 3)."
  - "OSM way IDs are not obtainable via GraphHopper's public API surface in this version; only street_name/street_ref (OSM tag-derived) evidence was collected. See real_findings.osm_way_ids."
  - "This is a single run against a single dated extract on 2026-09-10, reusing the same PBF as v1/v2 (re-verified, not re-downloaded). It does not establish ongoing monitoring, a checksummed OPERATIONAL graph version, or A-M1-03's stable internal segment IDs."
  - "The rigid_truck safety fix (hard-excluding hgv==DELIVERY/DESTINATION, road_access==PRIVATE, and removing the max_weight_except bypass) did not change any route returned in this run, because this dataset does not currently exhibit those tag values on the queried paths (see real_findings.rigid_truck_fix_changed_feasibility_here). The fix closes a conservative-correctness gap for data this run did not happen to exercise; it is not validated end-to-end against a real DELIVERY/DESTINATION/PRIVATE-tagged or sub-16t-max_weight-tagged way in this corridor."
  - "No route in this evidence is operationally verified. GraphHopper returning HTTP 200 means the graph and vehicle constraints as encoded permit a path; it is not an authorized operational status, not a confirmed-safe route, and not a substitute for CONTRACTS.md's RouteVerificationPolicy outcome enum, which requires policy thresholds this audit does not have."
  - "The retained PBF, jar, and generated GraphHopper cache are NOT committed to git. Only this manifest, the raw JSON receipts, config, custom models, and derived corridor-edge mapping are committed. The scratch sandbox that ran the container (D:/SIH-2026/.m0-graph-sandbox3/) is deleted after evidence extraction; only the PBF is retained externally at the path recorded above."
