  hgv_tag_coverage: "missing (unset) along the entire returned path, every profile, every route"
  max_height_max_weight_tag_coverage: "unset along the entire returned path, every profile, every route"
  bridges_confirmed: "36-42 bridge segments per route via road_environment=BRIDGE"
  tunnels_confirmed: "1 tunnel segment per route via road_environment=TUNNEL"
  ford_confirmed_nh6_only: "1 ford segment on all three NH-6 queries; not present on NH-27 queries"
  construction_confirmed: false   # no road_class=CONSTRUCTION segment encountered on any returned path
  warnings_or_errors: "none; all six queries returned HTTP 200 with no 'hints'-reported routing errors (only visited_nodes performance stats)"
  road_name_evidence:
    nh27_primary: "No instruction street_name matched 'NH27', 'NH-27', or 'National Highway 27' on any of the three NH-27 queries (8 unique named streets, all local Guwahati-area roads e.g. Zoo Road, Kahilipara Road). Absence is not strong evidence against NH-27 identity: GraphHopper's `instructions[].street_name` reflects the OSM `name` tag, and Indian national-highway ways very often carry only a `ref` tag (e.g. ref=NH27) without a `name` tag, which this API surface does not expose. This audit run did not attempt an OSM ref/way-ID cross-reference (out of the bounded evidence scope declared for this task)."
    nh6_alternative: "The literal street_name 'NH6' appears in the instructions for all three NH-6 queries, giving direct (though single-segment) OSM-tag evidence that the waypoint-biased path traverses at least one way explicitly named 'NH6' in this OSM extract. This is real evidence, not an assumption, but it confirms only a segment of the route, not full end-to-end NH-6 continuity."

honest_limitations:
  - "Corridor identity for both routes is established by ORIGIN/DESTINATION/VIA-POINT selection plus the desk-audit band citations (NHAI/NHIDCL/Parliamentary record), not by an automated OSM ref/name match for every edge on the path. NH-6's single 'NH6' name match is stronger direct evidence than NH-27 currently has from this API surface."
  - "route_nh6_alternative is explicitly waypoint-biased through Shillong and Jowai; GraphHopper does not have a 'follow this named highway' query mode. See routes_queried.route_nh6_alternative.note."
  - "turn restrictions were not extracted from the real graph; GraphHopper's /route path-details API does not expose turn-cost/turn-restriction tables. This remains synthetic-fixture-only evidence (see docs/decisions/route-audit.md section 3)."
  - "This is a single run against a single dated extract on 2026-09-10. It does not establish ongoing monitoring, a checksummed OPERATIONAL graph version, or A-M1-03's stable internal segment IDs."
  - "No route in this document is operationally verified. GraphHopper returning HTTP 200 for a request means the graph and vehicle constraints as encoded permit a path; it is not an authorized operational status, not a confirmed-safe route, and not a substitute for CONTRACTS.md's RouteVerificationPolicy outcome enum (verified/degraded/insufficient_evidence/no_verified_feasible_route), which requires policy thresholds this audit does not have."
  - "The retained PBF, jar, and generated GraphHopper cache are NOT committed to git. Only this manifest, the raw JSON receipts, config, and custom models are committed. The scratch sandbox that ran the container (D:/SIH-2026/.m0-graph-sandbox2/) is deleted after evidence extraction, per instruction; only the PBF is retained externally at the path recorded above."
