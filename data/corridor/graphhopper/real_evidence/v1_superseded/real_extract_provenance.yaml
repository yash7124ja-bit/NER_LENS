  model. No separate official example encodes the project's light_goods
  (max_weight 3.5t / max_height 2.5m) or emergency (max_weight 7.5t /
  max_height 3.0m) numeric limits distinct from "truck" (18t / 4m per the
  official truck.json's hard-coded thresholds). Authoring project-specific
  custom_model JSON for light_goods/emergency with the exact vehicle_profiles.yaml
  numbers is real, bounded follow-on work for B-M1-02, not fabricated here.
  This run therefore evidences the car and truck profiles only, which is
  sufficient to prove GraphHopper import/query/hard-constraint mechanics work
  against the real corridor extract.

