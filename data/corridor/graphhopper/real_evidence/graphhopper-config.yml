graphhopper:
  datareader.file: /data/north-eastern-zone-260909.osm.pbf
  graph.location: /data/graph-cache

  profiles:
    - name: car
      custom_model_files: [my_car.json]
    - name: truck
      turn_costs:
        vehicle_types: [hgv, motorcar, motor_vehicle]
      custom_model_files: [my_truck.json]

  profiles_ch:
    - profile: car
  profiles_lm:
    - profile: truck

  graph.encoded_values: road_access, car_access, car_average_speed, hgv, max_width, max_height, max_weight, max_weight_except

  graph.dataaccess.default_type: RAM_STORE
  import.osm.ignored_highways: footway,cycleway,path,steps

server:
  application_connectors:
  - type: http
    port: 8989
    bind_host: 0.0.0.0
    max_request_header_size: 50k
  request_log:
      appenders: []
  admin_connectors:
  - type: http
    port: 8990
    bind_host: 0.0.0.0
logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
