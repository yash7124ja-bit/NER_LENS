[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ner-lens"
version = "0.1.0"
description = "NER LENS replay-first logistics decision-support backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "boto3>=1.35,<2",
  "cryptography>=45,<47",
  "fastapi>=0.141.1,<0.142",
  "geoalchemy2>=0.18,<1",
  "httpx>=0.28.1,<0.29",
  "pillow>=11.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13.4,<3",
  "pyproj>=3.7,<4",
  "python-dotenv>=1.1,<2",
  "shapely>=2.1,<3",
  "sqlalchemy>=2.0.49,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.46,<0.47",
  "weaviate-client>=4.16,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15.15,<0.16",
  "httpx>=0.28.1,<0.29",
  "pyyaml>=6.0.2,<7",
]
evaluation = [
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "pyarrow>=20,<24",
    "scikit-learn>=1.7,<2",
]
geospatial = [
    "geopandas>=1.1,<2",
    "rasterio>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
