[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ner-lens"
version = "0.1.0"
description = "NER LENS replay-first logistics decision-support backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.141.1,<0.142",
  "pydantic>=2.13.4,<3",
  "sqlalchemy>=2.0.49,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
