services:
  - type: web
    name: ner-lens-api
    repo: https://github.com/yash7124ja-bit/NER_LENS
    runtime: python
    plan: free
    region: singapore
    branch: sol/hackathon-replay-mvp
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m ner_lens.deploy
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: ner-lens-db
          property: connectionString
      - key: NER_LENS_ENV
        value: replay
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PROXY_SECRET
        sync: false
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: NER_LENS_BOOTSTRAP_EMAIL
        sync: false
      - key: NER_LENS_BOOTSTRAP_PASSWORD
        sync: false
      - key: NER_LENS_BOOTSTRAP_DISPLAY_NAME
        sync: false
      - key: NER_LENS_BOOTSTRAP_ROLES
        value: regional_viewer
databases:
  - name: ner-lens-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
